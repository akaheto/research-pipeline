[tool.poetry]
name = "research-pipeline"
version = "0.1.0"
description = "End-to-end research pipeline: collect, organize, rank, and output findings."
authors = ["Your Name <akaheto@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.12.0"
pydantic = "^2.0"
anthropic = "^0.28.0"
pandas = "^2.0"
python-docx = "^1.0"
aiohttp = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
black = "^24.1"
flake8 = "^7.0"
mypy = "^1.8"
ruff = "^0.3"

[tool.poetry.scripts]
pipeline = "research_pipeline.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
